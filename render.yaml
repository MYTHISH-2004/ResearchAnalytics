services:
  - type: web
    name: faculty-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    disk:
      name: faculty-analytics-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SQLITE_PATH
        value: /var/data/database.db
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: false
